name: Bug report
description: Report a reproducible problem in Cooee.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Before submitting, remove credentials, customer data, and private repository content.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include runtime, operating system, database, and deployment details that matter.
    validations:
      required: true
