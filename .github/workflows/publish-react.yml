name: Publish @cooeehq/react

on:
  push:
    tags:
      - "react-v*"
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0

      # v7 removes the dummy NODE_AUTH_TOKEN that prevented npm's OIDC exchange.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run --cwd packages/embed-react lint

      - name: Typecheck
        run: bun run --cwd packages/embed-react typecheck

      - name: Test
        run: bun test packages/embed-react

      - name: Build
        run: bun run --cwd packages/embed-react build

      - name: Verify release tag and unpublished version
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/embed-react/package.json').version")
          RELEASE_TAG="react-v$PACKAGE_VERSION"
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          if npm view "@cooeehq/react@$PACKAGE_VERSION" version; then
            echo "Version $PACKAGE_VERSION is already published"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/embed-react
