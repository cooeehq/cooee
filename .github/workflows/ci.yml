name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cooee_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tracked files for common secret formats
        run: bash .github/scripts/check-tracked-secrets.sh

      - name: Lint
        run: bun run lint --max-warnings=0

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Migrate a real Postgres database twice
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/cooee_test
        run: |
          bun run migrate
          bun run migrate

      - name: Build
        run: bun run build

      - name: Verify MCP production start
        run: bash .github/scripts/verify-mcp-production.sh

      - name: Audit dependencies
        run: bun audit

      - name: Verify React package contents
        run: npm pack --dry-run
        working-directory: packages/embed-react

      - name: Verify CLI package contents
        run: npm pack --dry-run
        working-directory: packages/cli

      - name: Verify React package types
        run: npx --yes @arethetypeswrong/cli@0.18.5 --pack . --profile esm-only
        working-directory: packages/embed-react

      - name: Verify React 18 and 19 consumers
        run: bash .github/scripts/verify-react-consumers.sh
