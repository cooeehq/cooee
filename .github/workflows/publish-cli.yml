name: Publish cooee-changelog

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --cwd packages/cli typecheck

      - name: Test
        run: bun test packages/cli

      - name: Build
        run: bun run --cwd packages/cli build

      - name: Verify package contents
        run: npm pack --dry-run
        working-directory: packages/cli

      - name: Verify release tag and unpublished version
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")
          RELEASE_TAG="cli-v$PACKAGE_VERSION"
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          if npm view "cooee-changelog@$PACKAGE_VERSION" version; then
            echo "Version $PACKAGE_VERSION is already published"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/cli
